[package]
name = "docq-retrieve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hybrid retrieval pipeline for docq."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/docq"
readme = "../../README.md"
keywords = ["rag", "retrieval", "bm25", "search"]
categories = ["algorithms", "text-processing"]

[dependencies]
docq-core = { workspace = true }
docq-model = { workspace = true, features = ["rerank"] }
docq-storage = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }

[dev-dependencies]
docq-indexer = { workspace = true }
tempfile = "3"

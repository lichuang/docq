[package]
name = "docq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for local-first search and answers over your documents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/docq"
readme = "../../README.md"
keywords = ["cli", "rag", "search", "local"]
categories = ["command-line-utilities"]

[dependencies]
docq-core = { workspace = true }
docq-model = { workspace = true }
docq-indexer = { workspace = true }
docq-storage = { workspace = true }
docq-retrieve = { workspace = true }
docq-synth = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
tokenizers = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
flexi_logger = { workspace = true }
tokio-stream = { workspace = true }

[features]
default = ["pdf", "docx"]
pdf = ["docq-indexer/pdf"]
docx = ["docq-indexer/docx"]

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "docq"
path = "src/lib.rs"

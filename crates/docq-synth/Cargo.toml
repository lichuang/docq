[package]
name = "docq-synth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Citation-grounded answer synthesis for docq."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/docq"
readme = "../../README.md"
keywords = ["rag", "llm", "synthesis", "citations"]
categories = ["algorithms", "text-processing"]

[dependencies]
docq-core = { workspace = true }
docq-model = { workspace = true, features = ["llm"] }
docq-retrieve = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
regex = "1"
log = { workspace = true }

[dev-dependencies]
docq-indexer = { workspace = true }
docq-storage = { workspace = true }
tempfile = "3"

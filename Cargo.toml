[workspace]
resolver = "2"
members = [
    "crates/docq-core",
    "crates/docq-model",
    "crates/docq-indexer",
    "crates/docq-storage",
    "crates/docq-retrieve",
    "crates/docq-synth",
    "crates/docq",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
jieba-rs = "0.7"
tokenizers = "0.20"
fastembed = "5"
llama-cpp-2 = "0.1"
hf-hub = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1"
glob = "0.3"
walkdir = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"
log = "0.4"
flexi_logger = "0.29"
docq-core = { path = "crates/docq-core", version = "0.1.0" }
docq-model = { path = "crates/docq-model", version = "0.1.0" }
docq-indexer = { path = "crates/docq-indexer", version = "0.1.0" }
docq-storage = { path = "crates/docq-storage", version = "0.1.0" }
docq-retrieve = { path = "crates/docq-retrieve", version = "0.1.0" }
docq-synth = { path = "crates/docq-synth", version = "0.1.0" }

# esaxx-rs 0.1.10 unconditionally forces /MT on Windows, which conflicts with
# other C/C++ dependencies (e.g. llama.cpp) that use /MD. Vendor a patched copy
# that uses the dynamic runtime on Windows so the linker can produce a binary.
[patch.crates-io]
esaxx-rs = { path = "vendor/esaxx-rs" }
